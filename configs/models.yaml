models:
  allowed: ["elastic_net", "xgboost"]
  elastic_net:
    objective: "regression"
    tuning:
      method: "time_cv"
      param_grid:
        alpha: [0.0001, 0.001, 0.01, 0.1]
        l1_ratio: [0.1, 0.5, 0.9]
  xgboost:
    objective: "reg:squarederror"
    tuning:
      method: "time_cv"
      param_grid:
        max_depth: [2, 3, 4]
        eta: [0.01, 0.05, 0.1]
        subsample: [0.7, 1.0]
        colsample_bytree: [0.7, 1.0]
        n_estimators: [200, 500]
